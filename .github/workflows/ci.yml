name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # The launcher resolves install directories per-platform, so all three
        # matter: the %LOCALAPPDATA% branch only exists on Windows and the
        # $HOME/.local/bin branch only on macOS/Linux.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # harden-runner only supports Linux runners; skip it on Windows/macOS.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            bun.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Build before the smoke steps below, which run the built entry point.
      # `bun run build` does not typecheck, so nothing is lost by running it first.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
        env:
          CI: "true"

      # The launcher is a BIN, not a library — there are no named exports to
      # require-smoke the way the sibling client package does. The equivalent
      # end-to-end check is that the built entry actually runs and takes the
      # not-found branch: a CI runner has no `nimbus` on PATH, so resolution must
      # fail cleanly with the explain() message and exit 1, rather than throwing
      # an unhandled error or hanging on a spawn that never happens.
      - name: Setup Node (bin smoke)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Smoke-test the built bin under Node
        shell: bash
        run: |
          set -uo pipefail
          # Point HOME and LOCALAPPDATA at empty directories rather than relying on
          # the runner simply not having Nimbus installed. CANDIDATE_DIRS searches
          # those roots independently of PATH, so an implicit "clean runner"
          # assumption would silently flip this to the FOUND branch the day any
          # other step installs the CLI — and the found branch spawns an MCP server
          # that waits on stdio, so the failure would be a timeout, not a message.
          iso="$(mktemp -d)"
          mkdir -p "${iso}/home" "${iso}/lad"
          out="$(env -u NIMBUS_BIN HOME="${iso}/home" USERPROFILE="${iso}/home" \
                 LOCALAPPDATA="${iso}/lad" node dist/index.js 2>&1)" && code=0 || code=$?
          echo "exit=${code}"
          echo "${out}"
          if [ "${code}" != "1" ]; then
            echo "::error::expected exit 1 when no nimbus binary is resolvable, got ${code}"
            exit 1
          fi
          case "${out}" in
            *"Could not find the Nimbus CLI"*) echo "bin smoke OK" ;;
            *) echo "::error::expected the not-found explanation, got: ${out}"; exit 1 ;;
          esac

      # This CANNOT be caught by the smoke above, which runs on the machine that
      # built the bundle — where a baked-in absolute path still resolves. The
      # sibling client package shipped exactly that bug in 0.7.0: a module-scope
      # `fileURLToPath(import.meta.url)` got frozen to `/home/runner/work/...`, so
      # every consumer threw ERR_INVALID_FILE_URL_PATH while CI stayed green.
      # An absolute path in a published bundle is never correct; asserting there is
      # none is machine-independent, and so actually catches it.
      # Node, not a shell one-liner: this matrix includes windows-latest, where the
      # default shell is PowerShell and `if grep ...; then` is a parse error.
      - name: The bundle must not embed a build-machine path
        run: >
          node -e "const s = require('fs').readFileSync('dist/index.js', 'utf8');
          const hits = s.match(/file:\/\/\/[\w\-./:@%+]*/g);
          if (hits) { console.error('::error::dist/index.js embeds an absolute build-machine file:// URL: '
          + hits[0] + ' -- something reached import.meta.url at module scope and the bundler froze this
          machine path into the artifact.'); process.exit(1); }
          console.log('no embedded build-machine paths');"
