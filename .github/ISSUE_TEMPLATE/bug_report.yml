name: Bug report
description: Report a problem with @nimbus-dev/mcp
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This repo is only the MIT launcher: it finds the
        `nimbus` binary already installed on your machine and execs it as
        `nimbus mcp-server --stdio`. For issues in the gateway, connectors, Vault,
        the HITL machinery, or in an MCP **tool** itself, please use the
        [Nimbus](https://github.com/nimbus-agent/Nimbus) repository instead. What
        belongs here: the launcher cannot find an installed Nimbus, it reports a
        wrong exit code, or a real install channel's directory is missing.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version (@nimbus-dev/mcp)
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime & version
      placeholder: "Bun 1.2.x / Node 22.x"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant details
      description: Minimal repro, the message the launcher printed, and your MCP client's server config for it.
      render: shell
