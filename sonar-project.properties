# SonarQube Cloud (SonarCloud) configuration for nimbus-mcp.
# Project must be imported into the `nimbus-agent` SonarCloud org and the
# org-level SONAR_TOKEN secret granted to this repo; the sonar.yml workflow
# skips analysis when the token is absent — note that it skips the STEP, not
# the JOB, so the check still reports green. A green Sonar check here is
# therefore not evidence that anything was analysed; confirm the scan actually
# ran the first time.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-mcp
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Unlike the sibling client package there is no `test/` or `scripts/` directory
# here — every source and every test lives in `src/`. Both keys must still name
# `src`: sonar.test.inclusions filters INSIDE sonar.tests, so a directory absent
# from sonar.tests cannot be reclassified and its tests get analysed as
# production source.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts

# `src/index.ts` is a shebang bin entry: top-level side effects that spawn a
# child process, so it cannot be unit-tested without launching one. The Nimbus
# monorepo exempted the same file for the same reason while it lived there
# (scripts/coverage-floor/exclusions.ts).
sonar.coverage.exclusions=src/index.ts

# bun test --coverage --coverage-reporter=lcov writes coverage/lcov.info.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true
